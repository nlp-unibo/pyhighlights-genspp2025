[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genspp2025"
version = "0.1.0"
description = "Reproduction of Ruggeri and Signorelli, ACL 2025, on pyhighlights"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    # The reproduction is configuration; every component it names is the
    # library's. Each floor is a defect rather than a preference.
    #
    # 0.12.0: a run reports what it cost under `cost_`, which is the table
    # `compare.py` prints beside Table 1; an older library writes no such
    # column and that table reads as empty.
    #
    # 0.11.0: `ToyLoader` reads as well as generates, which is how the released
    # corpus is loaded here at all -- 0.10.0 and earlier read it with a
    # `GenSPPToyLoader` that no longer exists. Worse than absent on an older
    # library: `ToyLoader(url=...)` there is an unknown argument, and a
    # `ToyLoader` without a `url` *generates*, so the failure mode is training
    # on a corpus of the right shape and the wrong content.
    #
    # 0.9.0 renamed `AnnotationAggregator(rationale=)` to `highlights=` and
    # `RATIONALES` to `HIGHLIGHTS`, which the HateXplain half calls.
    #
    # Commit d245d98 makes FR, MCD and MGR sample their selection at
    # evaluation and leaves the four baselines' empty selections unrepaired, as
    # their original implementations do. Every model pools the kept positions
    # alone, GenSPP selects with one sigmoid unit as the release does, and a
    # task can embed every token of every split. A flat Toy corpus holds out
    # the rows the released baselines hold out. Commit 584cf3b below it
    # normalises MCD's, MGR's and G-RAT's encoders where their original
    # implementations do, and e081700 below it lets MCD validate on
    # the losses the setup monitors. Commit 30bc583 below it guides G-RAT with
    # the original guidance module. Commit a071d49 below it rebuilds a run's test predictions from its checkpoints,
    # which the HateXplain runs did not store. Commit e48068b below it loads
    # the embedding table into G-RAT's guider, which read a table of its own
    # before: random on Toy, two rows on HateXplain.
    # Commit bd0ad26 below it regroups a GenSPP candidate's training batches at every
    # epoch, as the release's shuffling loader does. Commit 3519758 below it
    # writes each finished seed before starting the next. It
    # also carries the released threshold arm, scores GenSPP candidates in
    # spawned worker processes, and lets the GenSPP backbones leave out layer
    # normalisation. Pin the commit because these changes have not been
    # released.
    "pyhighlights @ https://github.com/nlp-unibo/pyhighlights/archive/d245d98fdac07a9c9fdb2472afe9c5acc12eaa38.tar.gz",
    # Named directly because `compare.py` reads a results tree with it. It
    # arrives through pyhighlights as well; a floor of ours on something we
    # import ourselves is not a floor to inherit.
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0",
    "ruff>=0.15.20",
]

[project.urls]
Paper = "https://aclanthology.org/2025.acl-long.59/"
"Reference implementation" = "https://github.com/nlp-unibo/gen-spp"
Library = "https://github.com/nlp-unibo/pyhighlights"

[tool.setuptools.packages.find]
include = ["genspp2025*"]

[tool.ruff]
# The library's, so that configuration moved from it keeps passing what it
# passed there.
target-version = "py310"
extend-exclude = ["*.md"]
line-length = 88
lint.select = ["E", "F", "I", "W"]
